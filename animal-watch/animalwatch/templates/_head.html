<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f5;--card:#fff;--fg:#1d2420;--muted:#66706a;--line:#dde2de;--acc:#2f7d4f;--warn:#b5462f}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d221f;--fg:#e6ebe7;--muted:#9aa59e;--line:#2d3530;--acc:#5cc287;--warn:#ff8a70}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;gap:18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font-size:17px}header a{color:var(--muted);text-decoration:none}header a.on{color:var(--acc);font-weight:600}
main{padding:16px 20px;max-width:1400px;margin:0 auto}
button,select,input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.muted{color:var(--muted)}.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--line);font-size:12px}
.ok{color:var(--acc)}.bad{color:var(--warn)}
</style>
